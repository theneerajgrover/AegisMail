<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="envelopeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <!-- Shield body -->
  <path d="M32 4 L54 14 V30 C54 45 42 55 32 60 C22 55 10 45 10 30 V14 Z" fill="url(#shieldGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- Inner shadow/depth on shield -->
  <path d="M32 8 L50 16.5 V30 C50 42.5 40 51.5 32 56 C24 51.5 14 42.5 14 30 V16.5 Z" fill="rgba(0,0,0,0.15)"/>
  <!-- Envelope body -->
  <rect x="20" y="24" width="24" height="16" rx="2" fill="url(#envelopeGrad)" opacity="0.95"/>
  <!-- Envelope flap (V shape) -->
  <path d="M20 24 L32 33 L44 24" fill="none" stroke="#06b6d4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Small checkmark in bottom-right of shield -->
  <circle cx="43" cy="44" r="7" fill="#10b981"/>
  <path d="M39.5 44 L42 46.5 L46.5 41.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
