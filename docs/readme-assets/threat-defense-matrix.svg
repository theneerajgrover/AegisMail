<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="matrixBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060b17"/>
      <stop offset="50%" stop-color="#091024"/>
      <stop offset="100%" stop-color="#040711"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c33"/>
      <stop offset="100%" stop-color="#0c1222"/>
    </linearGradient>

    <linearGradient id="bannerGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glowing Pill Gradients -->
    <linearGradient id="dangerPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="safePill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Filter -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>

    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Container -->
  <rect width="1000" height="360" rx="16" fill="url(#matrixBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect width="1000" height="360" rx="16" fill="url(#cardGrid)"/>

  <!-- Top Header Bar -->
  <g transform="translate(40, 36)">
    <rect x="0" y="-12" width="4" height="24" rx="2" fill="url(#bannerGlow)"/>
    <text x="16" y="-1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#06b6d4" letter-spacing="2">ADVERSARIAL ATTACK VECTORS VS. AEGISMAIL DEFENSE MATRIX</text>
    <text x="16" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">
      Why Conventional Spam Filters Fail &amp; How AegisMail Neutralizes Attacks
    </text>
  </g>

  <!-- ==================== COLUMN 1: LEETSPEAK EVASION ==================== -->
  <g transform="translate(40, 85)">
    <!-- Card Body -->
    <rect width="293" height="245" rx="12" fill="url(#cardGrad1)" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1" filter="url(#softShadow)"/>
    <!-- Top Accent Bar -->
    <rect x="1" y="1" width="291" height="3" rx="1.5" fill="#06b6d4"/>

    <!-- Threat Title -->
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. Leetspeak &amp; Obfuscation</text>
    <text x="20" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">VECTOR: HOMOGLYPH SUBSTITUTION</text>

    <!-- Attack Payload Box -->
    <rect x="16" y="60" width="261" height="52" rx="6" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="0.8"/>
    <text x="26" y="78" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#f43f5e">ATTACKER INJECTION:</text>
    <text x="26" y="98" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#fecdd3">"cl@1m ur fr33 c@rd n0w!"</text>

    <!-- Conventional Filter Result -->
    <text x="18" y="130" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">&#215; Standard Filters: BYPASSED (0 hits)</text>

    <!-- AegisMail Defense Box -->
    <rect x="16" y="145" width="261" height="85" rx="6" fill="rgba(6, 182, 212, 0.06)" stroke="rgba(6, 182, 212, 0.22)" stroke-width="0.8"/>
    <text x="26" y="165" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#38bdf8">&#10003; AEGISMAIL CANONICALIZATION:</text>
    <text x="26" y="185" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#67e8f9">"claim your free card now!"</text>
    <text x="26" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">&#8226; Char-wb subword features (3-5 ngrams)</text>
    <text x="26" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">&#8226; Evasion tokens counted: 4 &#8594; 98.8% Spam</text>
  </g>

  <!-- ==================== COLUMN 2: BAYESIAN POISONING ==================== -->
  <g transform="translate(353, 85)">
    <!-- Card Body -->
    <rect width="293" height="245" rx="12" fill="url(#cardGrad1)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" filter="url(#softShadow)"/>
    <!-- Top Accent Bar -->
    <rect x="1" y="1" width="291" height="3" rx="1.5" fill="#6366f1"/>

    <!-- Threat Title -->
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">2. Bayesian Poisoning</text>
    <text x="20" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">VECTOR: HAM WORD STUFFING</text>

    <!-- Attack Payload Box -->
    <rect x="16" y="60" width="261" height="52" rx="6" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="0.8"/>
    <text x="26" y="78" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#f43f5e">ATTACKER INJECTION:</text>
    <text x="26" y="94" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fecdd3">"Buy Viagra now! [Padded with 600</text>
    <text x="26" y="105" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fecdd3">words of Wikipedia academic text]"</text>

    <!-- Conventional Filter Result -->
    <text x="18" y="130" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">&#215; Standard Filters: DILUTED (Scores Safe)</text>

    <!-- AegisMail Defense Box -->
    <rect x="16" y="145" width="261" height="85" rx="6" fill="rgba(99, 102, 241, 0.06)" stroke="rgba(99, 102, 241, 0.22)" stroke-width="0.8"/>
    <text x="26" y="165" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#a5b4fc">&#10003; MULTI-SCALE SEGMENT SCAN:</text>
    <text x="26" y="185" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#c7d2fe">Doc: 12% &#8226; Seg 1: 99.7% &#8226; Seg 2: 2%</text>
    <text x="26" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">&#8226; Max-pool override: triggers if &#8805;88%</text>
    <text x="26" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">&#8226; Padding discarded &#8594; 99.68% Scam</text>
  </g>

  <!-- ==================== COLUMN 3: PHISHING LURES ==================== -->
  <g transform="translate(666, 85)">
    <!-- Card Body -->
    <rect width="293" height="245" rx="12" fill="url(#cardGrad1)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1" filter="url(#softShadow)"/>
    <!-- Top Accent Bar -->
    <rect x="1" y="1" width="291" height="3" rx="1.5" fill="#10b981"/>

    <!-- Threat Title -->
    <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. Cloud Document Lures</text>
    <text x="20" y="47" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">VECTOR: SOCIAL ENGINEERING / DRIVE</text>

    <!-- Attack Payload Box -->
    <rect x="16" y="60" width="261" height="52" rx="6" fill="rgba(244, 63, 94, 0.08)" stroke="rgba(244, 63, 94, 0.25)" stroke-width="0.8"/>
    <text x="26" y="78" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#f43f5e">ATTACKER INJECTION:</text>
    <text x="26" y="94" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fecdd3">"Someone shared a Google Drive PDF.</text>
    <text x="26" y="105" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fecdd3">Click here to view urgent document."</text>

    <!-- Conventional Filter Result -->
    <text x="18" y="130" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444">&#215; Standard Filters: FALSE CLEAN (No bad words)</text>

    <!-- AegisMail Defense Box -->
    <rect x="16" y="145" width="261" height="85" rx="6" fill="rgba(16, 185, 129, 0.06)" stroke="rgba(16, 185, 129, 0.22)" stroke-width="0.8"/>
    <text x="26" y="165" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#34d399">&#10003; HEURISTIC &amp; INTENT RECOGNITION:</text>
    <text x="26" y="185" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#a7f3d0">Shared drive pattern + credential urgency</text>
    <text x="26" y="204" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">&#8226; Flags: drive link, urgency, unverified sender</text>
    <text x="26" y="218" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8">&#8226; Intent pattern matched &#8594; 95.27% Scam</text>
  </g>
</svg>
