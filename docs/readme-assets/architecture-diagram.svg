<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="1000" height="580">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0a1025"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#141928"/>
    </linearGradient>
    <linearGradient id="headerBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="headerBar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="nodeGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <filter id="connGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <marker id="arrowHead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#06b6d4"/>
    </marker>
    <marker id="arrowHeadDash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366f1" opacity="0.6"/>
    </marker>
    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" rx="16" fill="url(#archBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect width="1000" height="580" rx="16" fill="url(#archGrid)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8" font-weight="600" letter-spacing="3">SYSTEM ARCHITECTURE</text>
  <line x1="380" y1="48" x2="620" y2="48" stroke="#6366f1" stroke-width="0.5" opacity="0.4"/>

  <!-- ===================== CLIENT ZONE ===================== -->
  <!-- Client container -->
  <rect x="40" y="70" width="440" height="450" rx="12" fill="none" stroke="rgba(6,182,212,0.15)" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="40" y="70" width="440" height="30" rx="12" fill="rgba(6,182,212,0.08)"/>
  <text x="60" y="90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#06b6d4" font-weight="600" letter-spacing="2">WEB BROWSER CLIENT</text>

  <!-- UI Node -->
  <rect x="80" y="120" width="360" height="52" rx="8" fill="url(#nodeGrad1)" stroke="rgba(6,182,212,0.2)" stroke-width="1" filter="url(#nodeGlow)"/>
  <rect x="80" y="120" width="4" height="52" rx="2" fill="#06b6d4"/>
  <text x="100" y="143" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">User Interface</text>
  <text x="100" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#64748b">HTML5 / CSS3 / JavaScript (ES6+) • Glassmorphic Design System</text>

  <!-- Three.js Node -->
  <rect x="80" y="190" width="170" height="52" rx="8" fill="url(#nodeGrad1)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <rect x="80" y="190" width="4" height="52" rx="2" fill="#10b981"/>
  <text x="100" y="213" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">Three.js 3D Scene</text>
  <text x="100" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" fill="#64748b">WebGL r128 • 3D Mail Node</text>

  <!-- App Controller Node -->
  <rect x="270" y="190" width="170" height="52" rx="8" fill="url(#nodeGrad1)" stroke="rgba(99,102,241,0.2)" stroke-width="1"/>
  <rect x="270" y="190" width="4" height="52" rx="2" fill="#6366f1"/>
  <text x="290" y="213" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#e2e8f0" font-weight="600">App Controller</text>
  <text x="290" y="228" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="9" fill="#64748b">app.js • Dual-Mode Router</text>

  <!-- Web ML Engine Node -->
  <rect x="80" y="290" width="360" height="70" rx="8" fill="url(#nodeGrad1)" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
  <rect x="80" y="290" width="4" height="70" rx="2" fill="#6366f1"/>
  <text x="100" y="315" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">In-Browser Web ML Engine</text>
  <text x="100" y="332" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#64748b">ml-engine.js • TF-IDF Vectorizer • Logistic Regression • Segment Scanning</text>
  <text x="100" y="348" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#64748b">Standalone inference for GitHub Pages (no backend required)</text>

  <!-- model_weights.json -->
  <rect x="120" y="380" width="280" height="40" rx="6" fill="rgba(99,102,241,0.08)" stroke="rgba(99,102,241,0.15)" stroke-width="1"/>
  <text x="150" y="405" font-family="'Courier New',monospace" font-size="11" fill="#94a3b8">📦 model_weights.json</text>
  <text x="330" y="405" font-family="'Segoe UI',sans-serif" font-size="9" fill="#64748b">~1MB pre-computed vocabulary + IDF + coefficients</text>

  <!-- Connection: App Controller → Web ML -->
  <line x1="355" y1="242" x2="355" y2="290" stroke="#6366f1" stroke-width="1" stroke-dasharray="4 3" opacity="0.5"/>
  <text x="360" y="272" font-family="'Segoe UI',sans-serif" font-size="8" fill="#6366f1" opacity="0.7">Fallback</text>

  <!-- Connection: Web ML → model_weights -->
  <line x1="260" y1="360" x2="260" y2="380" stroke="#6366f1" stroke-width="0.8" opacity="0.4"/>

  <!-- Connection: UI → Three.js -->
  <line x1="165" y1="172" x2="165" y2="190" stroke="#10b981" stroke-width="0.8" opacity="0.5"/>
  <text x="170" y="184" font-family="'Segoe UI',sans-serif" font-size="8" fill="#64748b">State Updates</text>

  <!-- Connection: UI → App Controller -->
  <line x1="355" y1="172" x2="355" y2="190" stroke="#6366f1" stroke-width="0.8" opacity="0.5"/>

  <!-- Status label -->
  <rect x="80" y="440" width="160" height="28" rx="14" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
  <circle cx="96" cy="454" r="4" fill="#06b6d4" opacity="0.7"/>
  <text x="108" y="458" font-family="'Segoe UI',sans-serif" font-size="10" fill="#06b6d4" font-weight="500">GitHub Pages Deploy</text>

  <!-- ===================== BACKEND ZONE ===================== -->
  <!-- Backend container -->
  <rect x="520" y="70" width="440" height="450" rx="12" fill="none" stroke="rgba(244,63,94,0.12)" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="520" y="70" width="440" height="30" rx="12" fill="rgba(244,63,94,0.06)"/>
  <text x="540" y="90" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#f43f5e" font-weight="600" letter-spacing="2">PYTHON BACKEND SERVER</text>

  <!-- FastAPI Node -->
  <rect x="560" y="120" width="360" height="52" rx="8" fill="url(#nodeGrad1)" stroke="rgba(244,63,94,0.2)" stroke-width="1" filter="url(#nodeGlow)"/>
  <rect x="560" y="120" width="4" height="52" rx="2" fill="#f43f5e"/>
  <text x="580" y="143" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">FastAPI Application</text>
  <text x="580" y="160" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="10" fill="#64748b">server.py • Uvicorn ASGI • Port 8000 • CORS Enabled</text>

  <!-- API Endpoints -->
  <rect x="560" y="190" width="170" height="52" rx="8" fill="url(#nodeGrad1)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <rect x="560" y="190" width="4" height="52" rx="2" fill="#06b6d4"/>
  <text x="580" y="210" font-family="'Courier New',monospace" font-size="10" fill="#06b6d4" font-weight="600">GET /api/health</text>
  <text x="580" y="228" font-family="'Segoe UI',sans-serif" font-size="9" fill="#64748b">Service health + model status</text>

  <rect x="750" y="190" width="170" height="52" rx="8" fill="url(#nodeGrad1)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <rect x="750" y="190" width="4" height="52" rx="2" fill="#06b6d4"/>
  <text x="770" y="210" font-family="'Courier New',monospace" font-size="10" fill="#06b6d4" font-weight="600">POST /api/predict</text>
  <text x="770" y="228" font-family="'Segoe UI',sans-serif" font-size="9" fill="#64748b">Email classification endpoint</text>

  <!-- EmailClassifierService -->
  <rect x="560" y="290" width="360" height="70" rx="8" fill="url(#nodeGrad1)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
  <rect x="560" y="290" width="4" height="70" rx="2" fill="#f59e0b"/>
  <text x="580" y="315" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">EmailClassifierService</text>
  <text x="580" y="332" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">feature_extractor.py • Canonicalization • Multi-Scale Evaluation</text>
  <text x="580" y="348" font-family="'Segoe UI',sans-serif" font-size="10" fill="#64748b">Segment scanning • Threat aggregation • Display features</text>

  <!-- Model files -->
  <rect x="560" y="380" width="170" height="48" rx="6" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <text x="580" y="400" font-family="'Courier New',monospace" font-size="10" fill="#f59e0b">tfidf_vectorizer</text>
  <text x="580" y="416" font-family="'Segoe UI',sans-serif" font-size="9" fill="#64748b">FeatureUnion (Word+Char)</text>

  <rect x="750" y="380" width="170" height="48" rx="6" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
  <text x="770" y="400" font-family="'Courier New',monospace" font-size="10" fill="#f59e0b">text_classifier</text>
  <text x="770" y="416" font-family="'Segoe UI',sans-serif" font-size="9" fill="#64748b">LogisticRegression (balanced)</text>

  <!-- Connections: FastAPI → Endpoints -->
  <line x1="645" y1="172" x2="645" y2="190" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>
  <line x1="835" y1="172" x2="835" y2="190" stroke="#06b6d4" stroke-width="0.8" opacity="0.5"/>

  <!-- Connection: predict → Service -->
  <line x1="835" y1="242" x2="835" y2="256" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="835" y1="256" x2="740" y2="256" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>
  <line x1="740" y1="256" x2="740" y2="290" stroke="#f59e0b" stroke-width="0.8" opacity="0.5"/>

  <!-- Connection: Service → Models -->
  <line x1="645" y1="360" x2="645" y2="380" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>
  <line x1="835" y1="360" x2="835" y2="380" stroke="#f59e0b" stroke-width="0.8" opacity="0.4"/>

  <!-- Status label -->
  <rect x="560" y="440" width="170" height="28" rx="14" fill="rgba(244,63,94,0.08)" stroke="rgba(244,63,94,0.15)" stroke-width="1"/>
  <circle cx="576" cy="454" r="4" fill="#f43f5e" opacity="0.7"/>
  <text x="588" y="458" font-family="'Segoe UI',sans-serif" font-size="10" fill="#f43f5e" font-weight="500">Local / Cloud Deploy</text>

  <!-- ===================== CROSS-ZONE CONNECTIONS ===================== -->
  <!-- Primary API request: UI → predict -->
  <line x1="440" y1="146" x2="560" y2="146" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrowHead)" filter="url(#connGlow)"/>
  <rect x="462" y="134" width="76" height="16" rx="4" fill="#090d16"/>
  <text x="500" y="146" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="9" fill="#06b6d4" font-weight="500">API Request</text>

  <!-- Response: predict → UI -->
  <line x1="560" y1="160" x2="440" y2="160" stroke="#10b981" stroke-width="1" marker-end="url(#arrowHead)" opacity="0.7"/>
  <rect x="462" y="152" width="76" height="16" rx="4" fill="#090d16"/>
  <text x="500" y="164" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="9" fill="#10b981" font-weight="500">JSON Result</text>

  <!-- Stateless label -->
  <rect x="560" y="480" width="360" height="28" rx="6" fill="rgba(16,185,129,0.06)" stroke="rgba(16,185,129,0.12)" stroke-width="1"/>
  <text x="740" y="498" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#10b981" font-weight="500">🛡 Stateless • Zero Database • Zero Retention • Privacy-By-Design</text>

  <!-- Bottom accent -->
  <line x1="200" y1="560" x2="800" y2="560" stroke="url(#arrowGrad)" stroke-width="0.5" opacity="0.3"/>
</svg>
