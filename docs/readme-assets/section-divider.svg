<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 30" width="1000" height="30">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="lineGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <rect width="1000" height="30" fill="transparent"/>
  <!-- Main line with glow -->
  <line x1="100" y1="15" x2="900" y2="15" stroke="url(#divGrad)" stroke-width="1" filter="url(#lineGlow)"/>
  <line x1="100" y1="15" x2="900" y2="15" stroke="url(#divGrad)" stroke-width="0.5"/>
  <!-- Center diamond accent -->
  <rect x="496" y="11" width="8" height="8" rx="1" fill="#06b6d4" opacity="0.7" transform="rotate(45,500,15)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>
  <!-- Side dots -->
  <circle cx="350" cy="15" r="2" fill="#6366f1" opacity="0.4"/>
  <circle cx="650" cy="15" r="2" fill="#6366f1" opacity="0.4"/>
</svg>
