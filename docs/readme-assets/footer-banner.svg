<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0a1025"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  <rect width="1000" height="120" rx="12" fill="url(#fbg)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Left divider line -->
  <line x1="500" y1="15" x2="500" y2="105" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <!-- Footer left text -->
  <text x="250" y="48" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">BUILT WITH</text>
  <text x="250" y="72" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">FastAPI • scikit-learn • Three.js • Vanilla JS</text>
  <text x="250" y="95" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b">Zero external UI frameworks • Zero databases • Zero retention</text>
  <!-- Footer right -->
  <text x="750" y="48" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#94a3b8" letter-spacing="1">DESIGNED &amp; ENGINEERED BY</text>
  <text x="750" y="72" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">Neeraj Grover</text>
  <text x="750" y="95" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="11" fill="#64748b">MIT License • © 2026</text>
  <!-- Accent bar at bottom -->
  <rect x="350" y="115" width="300" height="3" rx="1.5" fill="url(#bar1)" opacity="0.5"/>
</svg>
