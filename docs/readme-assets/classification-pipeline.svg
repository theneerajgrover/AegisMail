<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700">
  <defs>
    <linearGradient id="wfBg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="100%" stop-color="#0a1025"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1f35"/>
      <stop offset="100%" stop-color="#141928"/>
    </linearGradient>
    <linearGradient id="flowLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="stageGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
    <pattern id="wfGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="0.5"/>
    </pattern>
    <marker id="flowArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#06b6d4" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" rx="16" fill="url(#wfBg)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect width="1000" height="700" rx="16" fill="url(#wfGrid)"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#94a3b8" font-weight="600" letter-spacing="3">EMAIL CLASSIFICATION PIPELINE</text>
  <line x1="350" y1="48" x2="650" y2="48" stroke="#06b6d4" stroke-width="0.5" opacity="0.3"/>

  <!-- ===================== STAGE 0: INPUT ===================== -->
  <rect x="300" y="65" width="400" height="50" rx="10" fill="url(#stageGrad)" stroke="rgba(6,182,212,0.3)" stroke-width="1.2" filter="url(#stageGlow)"/>
  <rect x="300" y="65" width="4" height="50" rx="2" fill="#06b6d4"/>
  <text x="320" y="86" font-family="'Segoe UI',sans-serif" font-size="10" fill="#06b6d4" font-weight="700" letter-spacing="1">INPUT</text>
  <text x="320" y="102" font-family="'Segoe UI',sans-serif" font-size="11" fill="#94a3b8">User submits: Sender • Subject • Body • Attachments count</text>
  <!-- Flow arrow -->
  <line x1="500" y1="115" x2="500" y2="140" stroke="url(#flowLine)" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- ===================== STAGE 1: CANONICALIZATION ===================== -->
  <rect x="150" y="145" width="700" height="80" rx="10" fill="url(#stageGrad)" stroke="rgba(99,102,241,0.25)" stroke-width="1"/>
  <rect x="150" y="145" width="4" height="80" rx="2" fill="#6366f1"/>
  <!-- Stage number -->
  <rect x="170" y="155" width="55" height="20" rx="10" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.25)" stroke-width="0.5"/>
  <text x="197" y="169" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#6366f1" font-weight="700">Stage 1</text>
  <text x="240" y="169" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Text Canonicalization &amp; Evasion Detection</text>
  <text x="170" y="192" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• Deobfuscate homoglyphs: @ → a, 0 → o, 3 → e, 4 → a, 5 → s, $ → s, 8 → b, + → t</text>
  <text x="170" y="210" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• Expand chat shorthands: u → you, plz → please, fr33 → free   • Count evasion tokens for threat boosting</text>
  <!-- Flow arrow -->
  <line x1="500" y1="225" x2="500" y2="250" stroke="url(#flowLine)" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- ===================== STAGE 2: TF-IDF ===================== -->
  <rect x="150" y="255" width="700" height="80" rx="10" fill="url(#stageGrad)" stroke="rgba(6,182,212,0.25)" stroke-width="1"/>
  <rect x="150" y="255" width="4" height="80" rx="2" fill="#06b6d4"/>
  <rect x="170" y="265" width="55" height="20" rx="10" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.25)" stroke-width="0.5"/>
  <text x="197" y="279" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#06b6d4" font-weight="700">Stage 2</text>
  <text x="240" y="279" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Hybrid TF-IDF Feature Extraction (FeatureUnion)</text>

  <!-- Two sub-boxes -->
  <rect x="170" y="292" width="320" height="34" rx="6" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.12)" stroke-width="0.5"/>
  <text x="185" y="310" font-family="'Segoe UI',sans-serif" font-size="10" fill="#06b6d4" font-weight="500">Word N-Grams (1-2)</text>
  <text x="185" y="322" font-family="'Segoe UI',sans-serif" font-size="9" fill="#64748b">40,000 features • L2 normalized</text>

  <rect x="510" y="292" width="320" height="34" rx="6" fill="rgba(99,102,241,0.06)" stroke="rgba(99,102,241,0.12)" stroke-width="0.5"/>
  <text x="525" y="310" font-family="'Segoe UI',sans-serif" font-size="10" fill="#6366f1" font-weight="500">Subword Char-WB (3-5)</text>
  <text x="525" y="322" font-family="'Segoe UI',sans-serif" font-size="9" fill="#64748b">25,000 features • Word-boundary constrained</text>

  <!-- Flow arrow -->
  <line x1="500" y1="335" x2="500" y2="360" stroke="url(#flowLine)" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- ===================== STAGE 3: SEGMENT EVALUATION ===================== -->
  <rect x="150" y="365" width="700" height="80" rx="10" fill="url(#stageGrad)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
  <rect x="150" y="365" width="4" height="80" rx="2" fill="#f59e0b"/>
  <rect x="170" y="375" width="55" height="20" rx="10" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.2)" stroke-width="0.5"/>
  <text x="197" y="389" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#f59e0b" font-weight="700">Stage 3</text>
  <text x="240" y="389" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Multi-Scale Segment Evaluation (Anti-Poisoning)</text>
  <text x="170" y="412" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• Compute document-level threat score via Logistic Regression</text>
  <text x="170" y="428" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• Segment text by sentences / paragraphs → individually score each segment</text>
  <!-- Flow arrow -->
  <line x1="500" y1="445" x2="500" y2="470" stroke="url(#flowLine)" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- ===================== STAGE 4: THREAT FUSION ===================== -->
  <rect x="150" y="475" width="700" height="80" rx="10" fill="url(#stageGrad)" stroke="rgba(244,63,94,0.25)" stroke-width="1"/>
  <rect x="150" y="475" width="4" height="80" rx="2" fill="#f43f5e"/>
  <rect x="170" y="485" width="55" height="20" rx="10" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.2)" stroke-width="0.5"/>
  <text x="197" y="499" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#f43f5e" font-weight="700">Stage 4</text>
  <text x="240" y="499" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Threat Aggregation &amp; Sigmoid Classification</text>
  <text x="170" y="522" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• Max-pool: if segment ≥ 88% scam → overrides document score  • Evasion count ≥ 2 → boost floor to 85%</text>
  <text x="170" y="540" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• Bound probabilities [0.1%–99.9%]  • Threshold: ≥ 50% → Scam | &lt; 50% → Legitimate (Ham)</text>
  <!-- Flow arrow -->
  <line x1="500" y1="555" x2="500" y2="580" stroke="url(#flowLine)" stroke-width="1.5" marker-end="url(#flowArrow)"/>

  <!-- ===================== STAGE 5: OUTPUT ===================== -->
  <rect x="150" y="585" width="700" height="80" rx="10" fill="url(#stageGrad)" stroke="rgba(16,185,129,0.25)" stroke-width="1"/>
  <rect x="150" y="585" width="4" height="80" rx="2" fill="#10b981"/>
  <rect x="170" y="595" width="55" height="20" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.2)" stroke-width="0.5"/>
  <text x="197" y="609" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#10b981" font-weight="700">Stage 5</text>
  <text x="240" y="609" font-family="'Segoe UI',sans-serif" font-size="12" fill="#e2e8f0" font-weight="600">Reactive UI &amp; Three.js 3D Feedback</text>
  <text x="170" y="632" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• Animated circular threat gauge • Feature signal chips highlight active detections</text>
  <text x="170" y="648" font-family="'Segoe UI',sans-serif" font-size="10" fill="#94a3b8">• 3D Mail Node: Idle (cyan) → Scanning (indigo) → Safe (emerald) / Threat (crimson)</text>

  <!-- Bottom accent -->
  <line x1="300" y1="685" x2="700" y2="685" stroke="url(#flowLine)" stroke-width="0.5" opacity="0.3"/>
</svg>
