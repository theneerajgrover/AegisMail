<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0a1025"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <!-- Shield gradient -->
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="60%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Cyan glow -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <!-- Indigo glow -->
    <radialGradient id="indigoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Scan beam gradient -->
    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <!-- Envelope body gradient -->
    <linearGradient id="envGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Title shimmer -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
    </pattern>
    <!-- Shield glow filter -->
    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Soft glow -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Large ambient glow -->
    <filter id="ambientGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <!-- Particle glow -->
    <filter id="particleGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" fill="url(#bgGrad)"/>
  <rect width="1000" height="400" fill="url(#gridPattern)"/>

  <!-- Ambient glow orbs -->
  <ellipse cx="300" cy="200" rx="200" ry="150" fill="url(#indigoGlow)" filter="url(#ambientGlow)" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="700" cy="200" rx="180" ry="140" fill="url(#cyanGlow)" filter="url(#ambientGlow)" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Floating particles - left cluster -->
  <g filter="url(#particleGlow)">
    <circle cx="120" cy="80" r="1.5" fill="#06b6d4" opacity="0.6">
      <animate attributeName="cy" values="80;70;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="120" r="1" fill="#6366f1" opacity="0.5">
      <animate attributeName="cy" values="120;108;120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="300" r="1.2" fill="#06b6d4" opacity="0.4">
      <animate attributeName="cy" values="300;288;300" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="250" r="0.8" fill="#6366f1" opacity="0.3">
      <animate attributeName="cy" values="250;240;250" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Right particles -->
    <circle cx="850" cy="90" r="1.2" fill="#6366f1" opacity="0.5">
      <animate attributeName="cy" values="90;78;90" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="280" r="1" fill="#06b6d4" opacity="0.4">
      <animate attributeName="cy" values="280;270;280" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="320" r="1.5" fill="#10b981" opacity="0.3">
      <animate attributeName="cy" values="320;310;320" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="160" r="0.8" fill="#06b6d4" opacity="0.4">
      <animate attributeName="cy" values="160;150;160" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Center-area particles -->
    <circle cx="380" cy="100" r="1" fill="#06b6d4" opacity="0.3">
      <animate attributeName="cy" values="100;90;100" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="310" r="1.2" fill="#6366f1" opacity="0.35">
      <animate attributeName="cy" values="310;298;310" dur="5.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="340" r="0.9" fill="#10b981" opacity="0.25">
      <animate attributeName="cy" values="340;332;340" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="65" r="1.1" fill="#06b6d4" opacity="0.3">
      <animate attributeName="cy" values="65;55;65" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Orbital ring 1 (tilted ellipse) -->
  <ellipse cx="500" cy="200" rx="220" ry="70" fill="none" stroke="#6366f1" stroke-width="0.6" stroke-dasharray="6 8" opacity="0.25" transform="rotate(-15,500,200)">
    <animateTransform attributeName="transform" type="rotate" values="-15,500,200;345,500,200" dur="30s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Orbital ring 2 -->
  <ellipse cx="500" cy="200" rx="190" ry="90" fill="none" stroke="#06b6d4" stroke-width="0.5" stroke-dasharray="4 10" opacity="0.2" transform="rotate(25,500,200)">
    <animateTransform attributeName="transform" type="rotate" values="25,500,200;-335,500,200" dur="25s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Central composition group with float animation -->
  <g transform="translate(500,195)">
    <animateTransform attributeName="transform" type="translate" values="500,195;500,188;500,195" dur="5s" repeatCount="indefinite"/>

    <!-- Shield outline (outer glow) -->
    <path d="M0,-72 L48,-48 V10 C48,50 24,68 0,78 C-24,68 -48,50 -48,10 V-48 Z" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.2;0.45;0.2" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- Shield body -->
    <path d="M0,-62 L42,-40 V8 C42,42 22,58 0,67 C-22,58 -42,42 -42,8 V-40 Z" fill="url(#shieldGrad)" opacity="0.85" filter="url(#glowFilter)">
      <animate attributeName="opacity" values="0.8;0.95;0.8" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Shield inner depth -->
    <path d="M0,-52 L34,-34 V6 C34,34 18,48 0,55 C-18,48 -34,34 -34,6 V-34 Z" fill="rgba(0,0,0,0.2)"/>

    <!-- Envelope body (inside shield) -->
    <rect x="-28" y="-16" width="56" height="36" rx="3" fill="url(#envGrad)" stroke="#06b6d4" stroke-width="0.8" opacity="0.95"/>

    <!-- Envelope flap -->
    <path d="M-28,-16 L0,4 L28,-16" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- Scan beam sweeping across envelope -->
    <rect x="-30" y="-20" width="4" height="44" fill="url(#scanBeam)" opacity="0">
      <animate attributeName="x" values="-34;30;-34" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" dur="3s" repeatCount="indefinite" keyTimes="0;0.1;0.9;1"/>
    </rect>

    <!-- Checkmark (verification complete indicator) -->
    <circle cx="22" cy="14" r="8" fill="#10b981" opacity="0.9">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M18,14 L21,17 L26,11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Octahedron crest (rotating wireframe) -->
    <g transform="translate(0,-42)" opacity="0.6">
      <polygon points="0,-10 8,0 0,10 -8,0" fill="none" stroke="#06b6d4" stroke-width="0.8">
        <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- Orbiting dot 1 -->
    <circle cx="0" cy="0" r="2.5" fill="#06b6d4" filter="url(#particleGlow)">
      <animateMotion dur="6s" repeatCount="indefinite" path="M0,-80 A80,30 0 1,1 0.1,-80 Z"/>
      <animate attributeName="opacity" values="0.8;0.3;0.8" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting dot 2 -->
    <circle cx="0" cy="0" r="2" fill="#6366f1" filter="url(#particleGlow)">
      <animateMotion dur="8s" repeatCount="indefinite" path="M0,85 A85,35 0 1,0 0.1,85 Z"/>
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbiting dot 3 -->
    <circle cx="0" cy="0" r="1.8" fill="#10b981" filter="url(#particleGlow)">
      <animateMotion dur="10s" repeatCount="indefinite" path="M75,0 A75,40 0 1,1 74.9,0 Z"/>
      <animate attributeName="opacity" values="0.5;0.15;0.5" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title: AegisMail -->
  <text x="500" y="50" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#64748b" text-transform="uppercase">AI-POWERED EMAIL SECURITY</text>

  <!-- Bottom tagline -->
  <text x="500" y="355" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="12" fill="#64748b" letter-spacing="1">Multi-Scale NLP Classification • Adversarial Defense • Real-Time 3D Visualization</text>

  <!-- Subtle bottom line -->
  <line x1="350" y1="375" x2="650" y2="375" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
</svg>
