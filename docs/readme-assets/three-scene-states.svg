<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240">
  <defs>
    <linearGradient id="threeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="50%" stop-color="#080e21"/>
      <stop offset="100%" stop-color="#04060f"/>
    </linearGradient>

    <!-- State Gradients -->
    <linearGradient id="gradIdle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#083344"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>

    <linearGradient id="gradScan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>

    <linearGradient id="gradSafe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>

    <linearGradient id="gradSpam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect width="1000" height="240" rx="14" fill="url(#threeBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top Title -->
  <g transform="translate(30, 26)">
    <circle cx="6" cy="6" r="4" fill="#06b6d4"/>
    <text x="18" y="10" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#38bdf8" letter-spacing="1.5">THREE.JS (r128) WEBGL HOLOGRAPHIC MAIL NODE &#8226; DYNAMIC STATE MACHINE</text>
  </g>

  <!-- 4 State Cards (Width: 220 each, Gap: 20, Total: 4*220 + 3*20 = 940, Start X = 30) -->

  <!-- ==================== STATE 1: IDLE ==================== -->
  <g transform="translate(30, 48)">
    <rect width="220" height="170" rx="10" fill="url(#gradIdle)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.4"/>
    <!-- Status Pill -->
    <rect x="14" y="14" width="70" height="18" rx="9" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="0.8"/>
    <circle cx="23" cy="23" r="3" fill="#06b6d4"/>
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#67e8f9">IDLE</text>

    <!-- Mini 3D Envelope Graphic -->
    <g transform="translate(110, 82)">
      <!-- Orbital Rings -->
      <ellipse cx="0" cy="0" rx="42" ry="16" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3 4" opacity="0.6"/>
      <!-- Envelope -->
      <rect x="-24" y="-15" width="48" height="30" rx="2" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
      <path d="M -24 -15 L 0 2 L 24 -15" fill="none" stroke="#38bdf8" stroke-width="1.4"/>
      <!-- Glow Dot -->
      <circle cx="0" cy="2" r="3" fill="#06b6d4" filter="url(#nodeGlow)"/>
    </g>

    <!-- Description -->
    <text x="110" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Standby Ambient Float</text>
    <text x="110" y="148" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#67e8f9">0x06b6d4 &#8226; Cyan Ambient</text>
    <text x="110" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94a3b8">Interactive mouse-drag tilt</text>
  </g>

  <!-- ==================== STATE 2: SCANNING ==================== -->
  <g transform="translate(270, 48)">
    <rect width="220" height="170" rx="10" fill="url(#gradScan)" stroke="#6366f1" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Status Pill -->
    <rect x="14" y="14" width="80" height="18" rx="9" fill="rgba(99, 102, 241, 0.18)" stroke="#6366f1" stroke-width="0.8"/>
    <circle cx="23" cy="23" r="3" fill="#818cf8"/>
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#c7d2fe">SCANNING</text>

    <!-- Mini 3D Envelope Graphic -->
    <g transform="translate(110, 82)">
      <!-- Orbital Rings Spin -->
      <ellipse cx="0" cy="0" rx="44" ry="17" fill="none" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="6 3"/>
      <ellipse cx="0" cy="0" rx="38" ry="24" fill="none" stroke="#818cf8" stroke-width="0.8" stroke-dasharray="2 4"/>
      <!-- Envelope -->
      <rect x="-24" y="-15" width="48" height="30" rx="2" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
      <path d="M -24 -15 L 0 2 L 24 -15" fill="none" stroke="#a5b4fc" stroke-width="1.4"/>
      <!-- Laser Scan line -->
      <line x1="-8" y1="-15" x2="-8" y2="15" stroke="#38bdf8" stroke-width="2" filter="url(#nodeGlow)"/>
    </g>

    <!-- Description -->
    <text x="110" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Multi-Axis Acceleration</text>
    <text x="110" y="148" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#a5b4fc">0x6366f1 &#8226; Indigo Pulse</text>
    <text x="110" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94a3b8">Threat heuristic extraction</text>
  </g>

  <!-- ==================== STATE 3: SAFE ==================== -->
  <g transform="translate(510, 48)">
    <rect width="220" height="170" rx="10" fill="url(#gradSafe)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Status Pill -->
    <rect x="14" y="14" width="94" height="18" rx="9" fill="rgba(16, 185, 129, 0.18)" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="23" cy="23" r="3" fill="#34d399"/>
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#a7f3d0">VERIFIED SAFE</text>

    <!-- Mini 3D Envelope Graphic -->
    <g transform="translate(110, 82)">
      <!-- Orbital Rings Steady -->
      <ellipse cx="0" cy="0" rx="44" ry="17" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.8"/>
      <!-- Envelope -->
      <rect x="-24" y="-15" width="48" height="30" rx="2" fill="#064e3b" stroke="#10b981" stroke-width="1.4"/>
      <path d="M -24 -15 L 0 2 L 24 -15" fill="none" stroke="#34d399" stroke-width="1.6"/>
      <!-- Check Shield -->
      <circle cx="16" cy="10" r="7" fill="#10b981"/>
      <path d="M 13 10 L 15 12 L 19 8" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <!-- Description -->
    <text x="110" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Stable Protective Aura</text>
    <text x="110" y="148" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34d399">0x10b981 &#8226; Emerald Shield</text>
    <text x="110" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94a3b8">Clean integrity telemetry</text>
  </g>

  <!-- ==================== STATE 4: SPAM ==================== -->
  <g transform="translate(750, 48)">
    <rect width="220" height="170" rx="10" fill="url(#gradSpam)" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.6"/>
    <!-- Status Pill -->
    <rect x="14" y="14" width="102" height="18" rx="9" fill="rgba(244, 63, 94, 0.22)" stroke="#f43f5e" stroke-width="0.8"/>
    <circle cx="23" cy="23" r="3" fill="#f43f5e"/>
    <text x="32" y="26" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="700" fill="#fecdd3">THREAT BLOCKED</text>

    <!-- Mini 3D Envelope Graphic -->
    <g transform="translate(110, 82)">
      <!-- Orbital Rings Warning Flash -->
      <ellipse cx="0" cy="0" rx="46" ry="18" fill="none" stroke="#f43f5e" stroke-width="1.6" stroke-dasharray="4 2" filter="url(#nodeGlow)"/>
      <!-- Envelope Threat Pulse -->
      <rect x="-24" y="-15" width="48" height="30" rx="2" fill="#4c0519" stroke="#f43f5e" stroke-width="1.6"/>
      <path d="M -24 -15 L 0 2 L 24 -15" fill="none" stroke="#fb7185" stroke-width="1.6"/>
      <!-- Warning Octahedron -->
      <polygon points="0,-8 6,0 0,8 -6,0" fill="#f43f5e" stroke="#fff" stroke-width="0.8"/>
    </g>

    <!-- Description -->
    <text x="110" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#f1f5f9">Crimson Threat Pulse</text>
    <text x="110" y="148" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#f43f5e">0xf43f5e &#8226; Crimson Alert</text>
    <text x="110" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#94a3b8">Emissive intensity elevated</text>
  </g>
</svg>
